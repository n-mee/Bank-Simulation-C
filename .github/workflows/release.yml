name: C/C++ CI

on:
    push:
        branches: [ "development", "staging", "main" ]
        tags:
            - 'v*'
    pull_request:
        branches: [ "development", "staging", "main" ]

jobs:
    build:
        name: Build and Test
        strategy:
          matrix:
            os: [ubuntu-latest, windows-latest]
            include:
              - os: ubuntu-latest
                artifact_name: cBankApp_linux
              - os: windows-latest
                artifact_name: cBankApp.exe

        runs-on: ${{ matrix.os }}
        
        steps:
            - name: Checkout repository code
              uses: actions/checkout@v4

            - name: Install build tools and Valgrind
              if: matrix.os == 'ubuntu-latest'
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential valgrind

            - name: Setup CMake 4.0+
              uses: jwlawson/actions-setup-cmake@v2
              with:
                cmake-version: '4.0.x'

            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Compile project
              run: cmake --build build --config Release

            - name: Run Memory Leak Checks
              if: matrix.os == 'ubuntu-latest'
              run: echo "0" | valgrind --leak-check=full --error-exitcode=1 ./build/apps/bank_cli/bank_cli

            - name: Rename executable for releasing artifact
              shell: bash
              run: |
                if [ "${{ matrix.os }}" = "windows-latest" ]; then
                  mv ./build/apps/bank_cli/bank_cli.exe ${{ matrix.artifact_name }}
                else
                  mv ./build/apps/bank_cli/bank_cli ${{ matrix.artifact_name }}
                fi
            

            - name: Upload Artifacts for Release
              uses: actions/upload-artifact@v4
              with:
                name: ${{ matrix.artifact_name }}
                path: ${{ matrix.artifact_name }}
    
    release:
        name: Deploy Release App
        needs: build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        permissions:
          contents: write

        steps:
            - name: Download all compiled binaries
              uses: actions/download-artifact@v4
              with:
                path: ./artifacts
                merge-multiple: true
            
            - name: Create Automated Release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: ${{ github.ref_name }}
                name: Release ${{ github.ref_name }}
                draft: false
                prerelease: false
                files: |
                  ./artifacts/cBankApp_linux
                  ./artifacts/cBankApp.exe
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}